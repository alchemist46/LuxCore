name: LuxCore Python Wheels Builder

on:
  workflow_dispatch:
      inputs:
        build-type:
          description: 'Build type'
          required: true
          default: 'Release'
          type: choice
          options:
            - Release
            - Debug
  workflow_call:
    inputs:
      repository:
        description: 'Repository to check out'
        required: false
        default: ''
        type: string
      ref:
        description: 'The branch, tag or SHA to checkout.'
        required: false
        default: ''
        type: string
      version:
        description: 'The version to build - must comply to semver, or blank for default'
        type: string
      build-type:
        description: 'Build type'
        required: true
        default: 'Release'
        type: string
    outputs:
      commit:
        description: "The commit that has been checked out"
        value: ${{ jobs.build-wheels.outputs.commit }}
      branch:
        description: "The branch that has been checked out"
        value: ${{ jobs.build-wheels.outputs.branch }}
      attestation-url:
        description: "The url to the attestations"
        value: ${{ jobs.attest-wheels.outputs.attestation-url }}
      version:
        description: "The version actually built"
        value: ${{ jobs.build-wheels.outputs.version }}
  push:
  pull_request:

# A newer push (or pull request update) cancels the run of the older one. The
# full runs, started by hand or by the releaser, are never cancelled.
concurrency:
  group: wheels-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  # The OpenCL kernels are pre-compiled in SPIR-V format once (the format
  # is platform and python independent) and the result is served to all the
  # build legs (which don't need a clang anymore)
  bake-spirv:
    name: Bake SPIR-V modules
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout main repository (standard context)
        if: ${{ !env.ACT }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout main repository (act context)
        if: env.ACT
        uses: actions/checkout@v6

      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ clang cmake ninja-build libboost-dev

          # On Ubuntu, the clang SPIR-V target delegates to the external
          # SPIRV-LLVM-Translator: install the version matching the clang
          # one and expose it with the name clang looks for
          CLANG_MAJOR=$(clang --version | grep -oE 'version [0-9]+' | grep -oE '[0-9]+')
          sudo apt-get install -y "llvm-spirv-${CLANG_MAJOR}"
          sudo ln -sf "/usr/bin/llvm-spirv-${CLANG_MAJOR}" /usr/local/bin/llvm-spirv

      - name: Bake the SPIR-V modules
        shell: bash
        run: |
          # The bake is done by a dependency-free standalone project (see
          # build-system/spirv): no LuxCoreDeps, no conan, no 'make deps',
          # only the system g++ and clang. The configure fails with a clear
          # error if the clang can not compile OpenCL C in SPIR-V format.
          bash .github/scripts/run-annotated.sh "SPIR-V bake configure" cmake -S build-system/spirv -B bake-build -G Ninja
          bash .github/scripts/run-annotated.sh "SPIR-V bake" cmake --build bake-build

          # Check that the modules have actually been baked
          test -f bake-build/baked/spirvmanifest.txt

      - name: Upload the SPIR-V modules
        uses: actions/upload-artifact@v6
        with:
          name: spirv-baked
          path: bake-build/baked/

  # The HIP kernels are pre-compiled once for the generic AMD architectures
  # (RDNA2, RDNA3, RDNA4: the code objects are device code, platform and
  # python independent) and the result is embedded by all the build legs, so
  # an AMD GPU needs only the driver (no HIP SDK, no compilation at the first
  # rendering). See build-system/hip and docs/history/MODERNIZATION_PLAN.md (G9).
  bake-hip:
    name: Bake HIP kernels
    runs-on: ubuntu-24.04
    env:
      # The ROCm release whose clang and hiprtc bake the kernels
      ROCM_VERSION: '7.2'

    steps:
      - name: Checkout main repository (standard context)
        if: ${{ !env.ACT }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout main repository (act context)
        if: env.ACT
        uses: actions/checkout@v6

      - name: Read the HIPRT ref
        id: hiprt
        shell: bash
        run: |
          # The HIPRT version whose device code the HIPRT trace kernel
          # includes: the one shipped with pyluxcore (see
          # build-system/luxmake/hiprt.py)
          echo "ref=$(python3 -c "import json; print(json.load(open('build-system/build-settings.json'))['HIPRT']['ref'])")" >> "$GITHUB_OUTPUT"

      - name: Checkout HIPRT (headers of the trace kernel)
        uses: actions/checkout@v6
        with:
          repository: GPUOpen-LibrariesAndSDKs/HIPRT
          ref: ${{ steps.hiprt.outputs.ref }}
          path: hiprt-src
          submodules: false

      - name: Install build tools and ROCm
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install -y g++ cmake ninja-build libboost-dev wget gpg

          # The ROCm compiler (clang and the device libraries), the HIP
          # headers and the HIP runtime with hiprtc (its runtime header is
          # extracted by the bake). No GPU and no kernel driver are needed.
          sudo mkdir -p --mode=0755 /etc/apt/keyrings
          wget -q -O - https://repo.radeon.com/rocm/rocm.gpg.key | gpg --dearmor | sudo tee /etc/apt/keyrings/rocm.gpg > /dev/null
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/rocm.list
          printf 'Package: *\nPin: release o=repo.radeon.com\nPin-Priority: 600\n' \
            | sudo tee /etc/apt/preferences.d/rocm-pin-600
          sudo apt-get update -y
          sudo apt-get install -y rocm-llvm rocm-device-libs hip-dev hip-runtime-amd

      - name: Bake the HIP kernels
        shell: bash
        run: |
          # The bake is done by a dependency-free standalone project (see
          # build-system/hip): no LuxCoreDeps, no conan, no 'make deps', only
          # the system g++ and the ROCm clang.
          export ROCM_PATH=/opt/rocm
          bash .github/scripts/run-annotated.sh "HIP bake configure" cmake -S build-system/hip -B bake-build -G Ninja \
            -DHIPRT_INCLUDE_DIR="${GITHUB_WORKSPACE}/hiprt-src" \
            -DLUXRAYS_HIP_BAKE_JOBS=$(nproc)
          bash .github/scripts/run-annotated.sh "HIP bake" cmake --build bake-build

          # Check that the kernels have actually been baked
          test -f bake-build/baked/hipmanifest.txt
          ls -l bake-build/baked/*.co

      - name: Upload the HIP kernels
        uses: actions/upload-artifact@v6
        with:
          name: hip-baked
          path: |
            bake-build/baked/hipmanifest.txt
            bake-build/baked/*.co

  build-wheels:
    name: Build wheel ${{ matrix.os }}-3.${{ matrix.python-minor }}
    needs: [bake-spirv, bake-hip]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # A push or a pull request builds the Python of Blender 5 only (the
        # one the unit tests use); the full runs build every Python version
        python-minor: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '[13]' || '[10, 11, 12, 13, 14]') }}
        # No Intel Mac: Apple Silicon only. macOS is set aside for now: its
        # build fails (not investigated yet)
        #os: [ubuntu-latest, windows-2022, macos-15, windows-11-arm]
        os: [ubuntu-latest, windows-2022]
    env:
      # Reminder: report all variables here to CIBW_ENVIRONMENT_PASS_LINUX
      BUILD_TYPE: ${{ github.event.inputs.build-type || 'Release' }}
      CXX_VERSION: 20
      GCC_VERSION: 14
      GLIBC_VERSION: 2_28
      GH_TOKEN: ${{ github.token }}
      PYTHON_MINOR: ${{ matrix.python-minor }}
    outputs:
      commit: ${{ steps.current-commit.outputs.commit }}
      branch: ${{ steps.current-commit.outputs.branch }}
      version: ${{ steps.output-version.outputs.version }}

    steps:

      - name: Configure git for long paths
        shell: bash
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout main repository (standard context)
        if: ${{ !env.ACT }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout main repository (act context)
        if: env.ACT
        uses: actions/checkout@v6

      - name: Get current commit
        shell: bash
        id: current-commit
        run: |
          echo "commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "branch=$(git symbolic-ref HEAD)" >> $GITHUB_OUTPUT
          echo "commit=$(git rev-parse HEAD)"
          echo "branch=$(git symbolic-ref HEAD)"

      - name: Find workspace
        shell: bash
        run: |
          case ${{ runner.os }} in
            Linux) _workspace="/project";;
            Windows) _workspace=$(cygpath -u $GITHUB_WORKSPACE);;
            macOS) _workspace="$GITHUB_WORKSPACE";;
            *) echo "Unhandled os ${{ runner.os }}";exit 64;;
          esac
          echo "WORKSPACE=${_workspace}" >> $GITHUB_ENV

      - name: Set Conan parameters
        shell: bash
        run: |
            _build_type=$(echo "${{ env.BUILD_TYPE }}" | tr '[:upper:]' '[:lower:]')
            if [[ "${{ runner.os }}" == "Windows" ]]; then
              _conan_home=$(cygpath -w "${{ env.WORKSPACE }}/.conan2")
            else
              _conan_home="${{ env.WORKSPACE }}/.conan2"
            fi
            echo "CONAN_PRESET=conan-${_build_type}" >> $GITHUB_ENV
            echo "CONAN_HOME=${_conan_home}" >> $GITHUB_ENV

      - name: Configure ccache
        uses: actions/github-script@v8
        with:
          script: |
            const workspace = String.raw`${{ github.workspace }}`;

            const envVariables = {
                'cache-variant': String.raw`ccache`,
                'CMAKE_CXX_COMPILER_LAUNCHER': String.raw`ccache`,
                'CMAKE_C_COMPILER_LAUNCHER': String.raw`ccache`,
                'CCACHE_CONFIGPATH': String.raw`${workspace}/build-system/ccache.conf`,
                'CCACHE_DIR': String.raw`${workspace}/.ccache`,
                'CCACHE_DEBUGDIR': String.raw`${workspace}/ccache-debug`,
                'CCACHE_LOGFILE': String.raw`${workspace}/ccache.log`
            };

            for (const [key, value] of Object.entries(envVariables)) {
                core.exportVariable(key, value);
            }

      # Update apt: needed to install ccache
      - name: Update apt (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -y

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          create-symlink: false
          variant: ${{ env.cache-variant }}
          key: cpl-${{ matrix.os }}-${{ matrix.python-minor}}
          restore-keys: cpl-${{ matrix.os }}-${{ matrix.python-minor}}-
          max-size: 5G
          verbose: 1

      - name: Prepare msvc
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}

      - name: Download the pre-baked SPIR-V modules
        uses: actions/download-artifact@v7
        with:
          name: spirv-baked
          path: spirv-baked

      - name: Download the pre-baked HIP kernels
        # macOS has no HIP
        if: runner.os != 'macOS'
        uses: actions/download-artifact@v7
        with:
          name: hip-baked
          path: hip-baked

      # HIPRT (AMD hardware ray tracing) shipped with pyluxcore: the pinned
      # build, with its kernels precompiled (see build-system/luxmake/hiprt.py
      # and hiprt-builder.yml). macOS has no HIP.
      - name: Download HIPRT
        if: runner.os != 'macOS'
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=python; else PY=python3; fi
          "$PY" -m build-system.luxmake hiprt --dest hiprt-dist
          echo "HIPRT_LIBRARY_NAME=$(basename hiprt-dist/dist/bin/Release/*hiprt*64.*)" >> "$GITHUB_ENV"

      - name: Prepare Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          _V=${{ env.GCC_VERSION }}
          _T=/opt/rh/gcc-toolset-${_V}/root

          echo "TOOLSET_ROOT=${_T}" >> $GITHUB_ENV
          echo "CXX=${_T}/usr/bin/g++" >> $GITHUB_ENV
          echo "CC=${_T}/usr/bin/gcc" >> $GITHUB_ENV
          echo "AR=${_T}/usr/bin/ar" >> $GITHUB_ENV
          echo "RANLIB=${_T}/usr/bin/ranlib" >> $GITHUB_ENV

      - name: Set MacOS deployment target and other set-ups
        if: runner.os == 'macOS'
        uses: actions/github-script@v8
        with:
          # Minimum targets driven by:
          # Intel: libomp
          # Arm: opensubdiv
          script: |
            if ('${{ runner.arch }}' == 'X64') {
              target = '11.0';  // Required by libomp
              arch='x86_64';
            }
            else {
              target = '14.2';  // Required by opensubdiv
              arch='armv8';
            }
            core.exportVariable('MACOSX_DEPLOYMENT_TARGET', target);
            core.exportVariable('CMAKE_OSX_DEPLOYMENT_TARGET', target);
            core.exportVariable('PKG_ARCH', arch);

      - name: Prepare MacOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
            # We make conan believe we use apple-clang (see profiles), but
            # actually we use recent version of llvm, to get full compatibility
            # with C++20 (in particular: joining threads)

            LLVM_VERSION=21

            # llvm
            brew install llvm@${LLVM_VERSION}
            brew link llvm@${LLVM_VERSION} --overwrite
            LLVM_PREFIX=$(brew --prefix llvm@${LLVM_VERSION})
            echo "CC=clang" >> $GITHUB_ENV
            echo "CXX=clang++" >> $GITHUB_ENV
            echo "AR=llvm-ar" >> $GITHUB_ENV
            echo "RANLIB=llvm-ranlib" >> $GITHUB_ENV

            # lld
            brew install lld@${LLVM_VERSION}
            brew link lld@${LLVM_VERSION} --overwrite
            LLD_PREFIX=$(brew --prefix lld@${LLVM_VERSION})

            # Set paths
            echo "PATH=${LLVM_PREFIX}/bin:${LLD_PREFIX}/bin:$PATH" >> $GITHUB_ENV
            echo "DYLD_LIBRARY_PATH=${LLVM_PREFIX}/lib:${LLD_PREFIX}/lib:${DYLD_LIBRARY_PATH}" >> $GITHUB_ENV

            # Set flags
            echo "LDFLAGS=${LD_FLAGS} -fuse-ld=${LLD_PREFIX}/bin/ld64.lld -L${LLVM_PREFIX}/lib -L${LLD_PREFIX}/lib" >> $GITHUB_ENV
            echo "CPPFLAGS=${CPPFLAGS} -I${LLVM_PREFIX}/include -I${LLD_PREFIX}/include" >> $GITHUB_ENV


      # TODO: The following block is an ugly hack but, at the moment (2025-02-25),
      # scikit-build-core lacks a preset parameter, so this is the only way
      # I found to pass a calculated environment var to CMake build step
      - name: Set M4 env var
        if: runner.os != 'Windows'
        uses: actions/github-script@v8
        with:
          script: |
            if ('${{ runner.arch }}' == 'X64') {
              arch = 'x86_64'
            } else {
              arch = 'armv8'
            }
            base = '${{ env.WORKSPACE }}/out/dependencies/full_deploy/host/m4/1.4.19/Release/'
            core.exportVariable('M4', base + arch + '/bin/m4')

      - name: Export version for scikit-build-core
        shell: python
        run: |
          import json
          from pathlib import Path
          if (input_version := "${{ inputs.version }}"):
            result = input_version
          else:
            build_settings_file = Path("build-system", "build-settings.json")
            with open(build_settings_file) as in_file:
              default_version = json.load(in_file)["DefaultVersion"]
            result = ".".join(default_version[i] for i in ("major", "minor", "patch"))
            if (prerelease := default_version["prerelease"]):
              result = f"{result}-{prerelease}"

          print(f"Version: {result}")

          with open("SKVERSION", "w+") as out_file:
            out_file.write(result)

      - name: Output version
        id: output-version
        shell: bash
        run: |
          _version=$(cat SKVERSION)
          echo "version=${_version}" >> "$GITHUB_OUTPUT"


      # Build wheel
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          CIBW_BUILD_FRONTEND: build
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD: cp3${{ matrix.python-minor }}-*
          CIBW_SKIP: "*musllinux*"
          CIBW_ARCHS: auto64
          CIBW_MANYLINUX_X86_64_IMAGE: quay.io/pypa/manylinux_${{ env.GLIBC_VERSION }}_x86_64
          CIBW_ENVIRONMENT: >
            SKBUILD_CMAKE_ARGS='--preset conan-default;--log-level=VERBOSE;-DLUXCORE_VERSION=${{ steps.output-version.outputs.version }};-G Ninja Multi-Config'
            SKBUILD_CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            LUX_BUILD_TYPE=${{ env.BUILD_TYPE }}
            DEPS_WITHOUT_SUDO=1
          # Note: CIBW_ENVIRONMENT_LINUX REPLACES CIBW_ENVIRONMENT (not in
          # addition to it): it must repeat the whole environment, plus the
          # pre-baked SPIR-V modules directory (inside the container, the
          # repository is mounted under /project)
          CIBW_ENVIRONMENT_LINUX: >
            SKBUILD_CMAKE_ARGS='--preset conan-default;--log-level=VERBOSE;-DLUXCORE_VERSION=${{ steps.output-version.outputs.version }};-G Ninja Multi-Config'
            SKBUILD_CMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            LUX_BUILD_TYPE=${{ env.BUILD_TYPE }}
            DEPS_WITHOUT_SUDO=1
            LUXRAYS_SPIRV_BAKED_DIR=/project/spirv-baked
            LUXRAYS_HIP_BAKED_DIR=/project/hip-baked
            LUXRAYS_HIPRT_LIBRARY=/project/hiprt-dist/dist/bin/Release/${{ env.HIPRT_LIBRARY_NAME }}
          CIBW_ENVIRONMENT_PASS_LINUX: |
            CC
            CXX
            BUILD_TYPE
            GCC_VERSION
            SANITIZE
            ASAN_PATH
            RUNNER_OS
            RUNNER_ARCH
            WORKSPACE
            CMAKE_CXX_COMPILER_LAUNCHER
            CMAKE_C_COMPILER_LAUNCHER
            PYTHON_MINOR
            BOOST_INSTALL_LAYOUT
            SPDLOG_FMT_EXTERNAL
            CXX_VERSION
            CONAN_HOME
            CONAN_PRESET
            M4
          CIBW_BEFORE_ALL_LINUX: |
            # The container runs as root and doesn't have sudo: don't let
            # conan use it for the system package manager (it is also set
            # through CIBW_ENVIRONMENT but the propagation to before_all is
            # not guaranteed)
            export DEPS_WITHOUT_SUDO=1

            # Install toolchain (gcc, ccache...)
            dnf install -y epel-release
            dnf install -y almalinux-release-devel
            dnf install -y ccache
            dnf install -y perl-IPC-Cmd perl-Digest-SHA
            dnf install -y ninja-build

            # Install gh (via conda)
            dnf install -y wget
            mkdir -p miniconda3
            wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda3/miniconda.sh
            bash miniconda3/miniconda.sh -b -u -p miniconda3
            rm miniconda3/miniconda.sh
            source miniconda3/bin/activate
            conda init --all

            # Accept conda terms of service
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/main
            conda tos accept --override-channels --channel https://repo.anaconda.com/pkgs/r

            # Install gh. No 'gh auth login' here: the GH_TOKEN environment
            # variable (set through CIBW_ENVIRONMENT) already authenticates
            # gh and 'gh auth login' would refuse to run while it is set,
            # aborting the script BEFORE 'make deps' runs
            conda install gh --channel conda-forge -y

            # Manylinux_2_34 compatibility (for future use)
            if [[ ${{ env.GLIBC_VERSION }} != 2_28 ]]; then
              dnf install -y perl-FindBin perl-lib
            fi

            # Install dependencies
            pip install "conan==2.21" && pip install wheel && make deps

          CIBW_BEFORE_ALL_MACOS: |
            pip install "conan==2.21" && pip install wheel && make deps

          CIBW_BEFORE_ALL_WINDOWS: |
            pip install "conan==2.21" && pip install wheel && make deps


          CIBW_REPAIR_WHEEL_COMMAND_LINUX: |
            paths=$(find /project -type d -wholename "*/lib" -print0 | xargs -0 realpath | tr "\n" ":")
            LD_LIBRARY_PATH=$paths:$LD_LIBRARY_PATH
            echo "LD_LIBRARY_PATH=${LD_LIBRARY_PATH}"
            export LD_LIBRARY_PATH

            ## Check build data
            unzip {wheel} -d /tmp/wheel

            auditwheel \
              --verbose repair -w {dest_dir} \
              --plat manylinux_${{ env.GLIBC_VERSION }}_x86_64 \
              --only-plat \
              ${{ env.BUILD_TYPE == 'Release' && '--strip' || '' }} \
              {wheel}

          CIBW_REPAIR_WHEEL_COMMAND_WINDOWS: |
            bash.exe ${{ env.WORKSPACE }}/build-system/wheels/repair_wheel_windows.sh '{wheel}' '{dest_dir}' '%VCToolsRedistDir%%Platform%' '${{ env.WORKSPACE }}'
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: |
            cp {wheel} ${{ env.WORKSPACE }}
            paths=$(find ${{ env.WORKSPACE }} -type d -wholename "*/lib" -print0 | xargs -0 realpath | tr "\n" ":")
            DYLD_LIBRARY_PATH=$paths:$DYLD_LIBRARY_PATH
            echo "DYLD_LIBRARY_PATH=${DYLD_LIBRARY_PATH}"
            export DYLD_LIBRARY_PATH
            delocate-listdeps -v {wheel}
            delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}
          CIBW_TEST_COMMAND_LINUX: pyluxcoretest
          CIBW_TEST_COMMAND_WINDOWS: pyluxcoretest
          CIBW_TEST_COMMAND_MACOS: pyluxcoretest
          CIBW_CONTAINER_ENGINE: >
            docker;
            create_args:
              --mount type=bind,source=${{ env.CCACHE_DIR }},target=/root/.ccache
          # The pre-baked SPIR-V modules for the OpenCL kernels
          # pre-compilation (only used on Windows: on Linux the variable is
          # set through CIBW_ENVIRONMENT_LINUX, on macOS the pre-compilation
          # is disabled)
          LUXRAYS_SPIRV_BAKED_DIR: ${{ github.workspace }}\spirv-baked
          # The pre-baked HIP kernels (same rule: Windows only here; macOS
          # has no HIP)
          LUXRAYS_HIP_BAKED_DIR: ${{ github.workspace }}\hip-baked
          # The HIPRT library to ship (Windows only here, as above; empty on
          # macOS)
          LUXRAYS_HIPRT_LIBRARY: ${{ runner.os == 'Windows' && format('{0}\hiprt-dist\dist\bin\Release\{1}', github.workspace, env.HIPRT_LIBRARY_NAME) || '' }}

        with:
            package-dir: .
            output-dir: wheelhouse
            config-file: "{package}/pyproject.toml"


      - name: Save dependency cache
        if: always()
        id: cache-deps-save
        uses: actions/cache/save@v5
        with:
          path: conan-cache
          key: deps-${{ matrix.os }}-${{ matrix.python-minor}}-${{ hashFiles('**/conan-cache') }}

      #- name: Setup tmate session (debug)
        #if: ${{ failure() }}
        #uses: mxschmitt/action-tmate@v3

      # Upload artifacts
      - uses: actions/upload-artifact@v6
        id: upload
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ matrix.python-minor }}
          path: ./wheelhouse/*.whl

  # Unit tests (render diffs against the reference images) and benchmark of
  # the Linux wheel. The runners have no GPU: only the CPU engines are tested.
  unit-tests:
    name: Unit tests and benchmark (Linux, CPU)
    needs: [build-wheels]
    # Run even if another leg of the wheel matrix failed
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    env:
      PYTHON_MINOR: 13
      # The complete CPU test suite on demand, only PATHCPU otherwise
      TESTS_SUBSET: ${{ github.event_name == 'workflow_dispatch' && '' || '--subset' }}

    steps:
      - name: Checkout main repository (standard context)
        if: ${{ !env.ACT }}
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}

      - name: Checkout main repository (act context)
        if: env.ACT
        uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: 3.${{ env.PYTHON_MINOR }}

      - name: Download the wheel
        uses: actions/download-artifact@v7
        with:
          name: cibw-wheels-ubuntu-latest-${{ env.PYTHON_MINOR }}
          path: wheel

      - name: Install the wheel
        shell: bash
        run: |
          python -m pip install wheel/*.whl pillow

      - name: Run the unit tests
        shell: bash
        working-directory: pyunittests
        run: |
          # --strict: a missing reference image is an error
          python unittests.py --strict ${{ env.TESTS_SUBSET }}

      - name: Run the benchmark
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          # Shared runners are too noisy to fail on a regression: the results
          # are only recorded (job summary and artifact)
          python tests/benchmark/renderbench.py --engines PATHCPU \
            --scenes cornell,luxball-hdr,classroom --time 10 --warmup 3 \
            --output benchmark.json --markdown benchmark.md
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the test images
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-tests-images
          path: pyunittests/images/*.png

      - name: Upload the benchmark results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-linux-cpu
          path: benchmark.json
          if-no-files-found: ignore

  attest-wheels:
    needs: [build-wheels]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      id-token: write
    outputs:
      attestation-url: ${{ steps.attestation-step.outputs.attestation-url }}

    steps:
      - uses: actions/download-artifact@v7
        if: ${{ !env.ACT }}
        with:
          pattern: cibw-wheels-*
          path: ${{ github.workspace }}/dist
          merge-multiple: false

      - name: Generate artifact attestations
        id: attestation-step
        if: ${{ !env.ACT }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ github.workspace }}/dist/*
